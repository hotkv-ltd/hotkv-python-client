name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit-test:
    name: Build and unit test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests (no server required)
        run: python -m pytest tests/unit -v

      - name: Build wheel and sdist
        run: python -m build --outdir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/

  integration-test:
    name: Integration tests (optional, needs a HotKV server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false # enable once a HotKV server image/binary is available to this workflow
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      # To run locally instead: start a HotKV server, then
      #   HOTKV_TEST_URL=hotkv://127.0.0.1:6379 python -m pytest tests/integration -v
      - name: Run integration tests
        env:
          HOTKV_TEST_URL: hotkv://127.0.0.1:6379
        run: python -m pytest tests/integration -v
