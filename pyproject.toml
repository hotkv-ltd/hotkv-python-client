[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotkv-client"
version = "1.0.0"
description = "A high-performance Python client for HotKV, a RESP2/RESP3-compatible in-memory data store with built-in AI and LLM-serving features."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "HotKV Ltd", email = "support@hotkv.com" },
]
maintainers = [
    { name = "HotKV Ltd", email = "support@hotkv.com" },
]
keywords = ["hotkv", "database", "client", "key-value", "cache", "resp", "llm", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "build>=1.0",
    "langchain-core>=1.0; python_version >= '3.10'",  # langchain-core 1.x needs Python 3.10
    "llama-index-core>=0.14; python_version >= '3.10'",  # its dependency banks needs Python 3.10
    "litellm>=1.100; python_version >= '3.10'",  # litellm 1.100+ needs Python 3.10
    "fastapi>=0.100",  # litellm.completion()'s cache-hit path imports this internally
    "soundfile>=0.12",  # and this one (its transcription pass-through handler)
]
langchain = ["langchain-core>=1.0"]
llamaindex = ["llama-index-core>=0.14"]
litellm = ["litellm>=1.100"]

[project.urls]
Homepage = "https://hotkv.com"
Documentation = "https://hotkv.com/docs"
Repository = "https://github.com/hotkv-ltd/hotkv-python-client"
"Bug Tracker" = "https://github.com/hotkv-ltd/hotkv-python-client/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotkv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires HOTKV_TEST_URL pointing at a live HotKV server",
]
